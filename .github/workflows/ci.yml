name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
      CC: gcc
      GOCACHE: ${{ github.workspace }}/.artifacts/gocache
      GOMODCACHE: ${{ github.workspace }}/.artifacts/gomodcache

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: web

      - name: Run Go tests
        shell: bash
        run: go test -count=1 $(go list ./... | grep -v '/web/' | grep -v '/gen/')

      - name: Generate scoped Go coverage report
        shell: pwsh
        run: ./scripts/coverage.ps1

      - name: Run frontend tests
        run: npm test -- --run
        working-directory: web

      - name: Build frontend
        run: npm run build
        working-directory: web

      - name: Check Markdown formatting
        run: npm exec prettier -- --check ../docs/MVP.md ../docs/README.md ../docs/ARCHITECTURE.md ../docs/DEPLOYMENT.md ../docs/CONFIGURATION.md ../docs/API.md ../docs/CLI.md
        working-directory: web
