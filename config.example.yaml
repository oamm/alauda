server:
  address: "0.0.0.0"
  port: 9700
  logLevel: "debug"
  devMode: true

storage:
  provider: postgres
  connectionString: "postgres://alauda:change-me@localhost:5432/alauda?sslmode=disable"
  path: "./data/alauda.db"
  busyTimeout: 5s

health:
  workerCount: 20
  checkInterval: 10s
  defaultTimeout: 5s
  defaultFailureThreshold: 3
  defaultSuccessThreshold: 2
  resultRetentionHours: 24

telemetry:
  enabled: true
  otlpEndpoint: "http://localhost:4317"
  serviceName: "registry"
  serviceVersion: "0.1.0"

alerts:
  enabled: true
  cooldown: 10m
  maxRetries: 5

auth:
  enabled: true
  bootstrapAdminUsername: "root"
  bootstrapAdminEmail: "root@example.local"
  bootstrapCredentialPath: "./data/bootstrap-admin-credential"
  sessionCookieName: "alauda_session"
  tokenTTL: 24h

rateLimit:
  enabled: false
  requestsPerMinute: 600
  burst: 60
