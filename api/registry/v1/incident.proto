syntax = "proto3";

package registry.v1;

option go_package = "github.com/company/service-registry/gen/go/registry/v1;registryv1";

import "api/registry/v1/common.proto";
import "api/registry/v1/health.proto";
import "google/protobuf/timestamp.proto";

message Incident {
  string id = 1;
  string instance_id = 2;
  string deployment_id = 3;
  string environment_id = 4;
  string service_id = 5;
  IncidentState state = 6;
  google.protobuf.Timestamp opened_at = 7;
  google.protobuf.Timestamp resolved_at = 8;
  int64 duration_seconds = 9;
  string reason = 10;
  string impact_summary = 11;
  map<string, string> tags = 12;
  map<string, string> metadata = 13;
  string resolution_method = 14;
  string resolution_note = 15;
  string resolution_evidence_health_result_id = 16;
  string resolved_by = 17;
}

message GetIncidentRequest { string id = 1; }
message GetIncidentResponse { Incident incident = 1; }

message ListIncidentsRequest {
  PaginationRequest pagination = 1;
  string environment_id = 2;
  string service_id = 3;
  string deployment_id = 4;
  string instance_id = 5;
  IncidentState state = 6;
}

message ListIncidentsResponse {
  repeated Incident incidents = 1;
  PaginationResponse pagination = 2;
}

message VerifyIncidentRecoveryRequest {
  string id = 1;
}

message VerifyIncidentRecoveryResponse {
  Incident incident = 1;
  bool recovered = 2;
  google.protobuf.Timestamp checked_at = 3;
  HealthResult result = 4;
  string reason = 5;
}

message ResolveIncidentManuallyRequest {
  string id = 1;
  string note = 2;
}

message ResolveIncidentManuallyResponse { Incident incident = 1; }

message WatchIncidentsRequest {
  string environment_id = 1;
  string service_id = 2;
}

service IncidentService {
  rpc GetIncident(GetIncidentRequest) returns (GetIncidentResponse);
  rpc ListIncidents(ListIncidentsRequest) returns (ListIncidentsResponse);
  rpc VerifyIncidentRecovery(VerifyIncidentRecoveryRequest) returns (VerifyIncidentRecoveryResponse);
  rpc ResolveIncidentManually(ResolveIncidentManuallyRequest) returns (ResolveIncidentManuallyResponse);
  rpc WatchIncidents(WatchIncidentsRequest) returns (stream Incident);
}
