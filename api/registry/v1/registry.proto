syntax = "proto3";

package registry.v1;

option go_package = "github.com/company/service-registry/gen/go/registry/v1;registryv1";

import "api/registry/v1/common.proto";

message ResolveServiceRequest {
  string service_name = 1;
  string environment_key = 2;
  bool healthy_only = 3;
}

message ResolvedEndpoint {
  string instance_id = 1;
  string endpoint_id = 2;
  string host = 3;
  int32 port = 4;
  string path = 5;
  Protocol protocol = 6;
  HealthState health_state = 7;
}

message ResolveServiceResponse {
  string service_id = 1;
  string deployment_id = 2;
  repeated ResolvedEndpoint endpoints = 3;
}

message ResolveEndpointRequest {
  string service_name = 1;
  string endpoint_name = 2;
  string environment_key = 3;
  bool healthy_only = 4;
}

message ResolveEndpointResponse {
  string service_id = 1;
  string deployment_id = 2;
  repeated ResolvedEndpoint endpoints = 3;
}

service RegistryService {
  rpc ResolveService(ResolveServiceRequest) returns (ResolveServiceResponse);
  rpc ResolveEndpoint(ResolveEndpointRequest) returns (ResolveEndpointResponse);
}
